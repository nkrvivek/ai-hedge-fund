name: bridge-daily
on:
  schedule:
    - cron: "35 14 * * 1-5"   # 10:35 ET — post-open, settled prices
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: bridge-daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pipx install poetry && poetry install --no-interaction
      - uses: actions/cache@v5
        with:
          path: .v2_cache
          key: "v2cache-${{ github.run_number }}"
          restore-keys: v2cache-
      - name: run bridge
        env:
          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_TRADING_ENDPOINT: https://paper-api.alpaca.markets/v2
          UW_TOKEN: ${{ secrets.UW_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # The shared watch list (2026-08-13), read over the trade-refresh
          # worker's token-gated /watchlist route. Read-only by construction:
          # this repo holds no R2 credential, so it can never write the bucket
          # the other four books share.
          TR_WORKER_URL: ${{ secrets.TR_WORKER_URL }}
          TR_WORKER_TOKEN: ${{ secrets.TR_WORKER_TOKEN }}
          # 2026-07-17: daily digest email (secrets exist but were unmapped —
          # GH only exposes secrets explicitly listed here).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
        run: poetry run python -m bridge.run_daily
      - name: commit ledger
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The 08-06 row landed on main because a failed run was re-dispatched
          # by hand from that branch, and this step commits to whatever ref
          # triggered it. The book and the scorer read the ledger on their own
          # branch, so the day was invisible to both and nothing said so. Fail
          # here instead: the trading run above has already finished and sent
          # its digest, and a red bookkeeping step is the signal that a day's
          # row needs moving.
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "refusing to write the ledger on '$GITHUB_REF_NAME' —" \
                 "it belongs on '$DEFAULT_BRANCH'. Re-dispatch there."
            exit 1
          fi
          git config user.name "bridge-bot" && git config user.email "bridge@local"
          git add bridge/ledger.jsonl bridge/learning_log.jsonl || true
          git diff --cached --quiet || git commit -m "ledger: $(date -u +%F)" && git push || true
